<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>
</head>
<body>

    <h1>Edit User Profile</h1>

    <p th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/profile/{id}/edit(id=${userProfile.userId})}"
          th:object="${userProfile}"
          method="post">

        <label for="name">Name:</label>
        <input type="text"
               id="name"
               th:field="*{name}"
               required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number"
               id="age"
               th:field="*{age}"
               min="18"
               required>
        <br><br>

        <label for="bio">Bio:</label>
        <textarea id="bio"
                  th:field="*{bio}"
                  rows="5"
                  cols="40"></textarea>
        <br><br>

        <label for="profilePicture">Profile Picture:</label>
        <input type="text"
               id="profilePicture"
               th:field="*{profilePicture}">
        <br><br>

        <button type="submit">Update Profile</button>

    </form>

    <br>

    <a th:href="@{/profile/{id}(id=${userProfile.userId})}">
        Back to Profile
    </a>

</body>
</html>
